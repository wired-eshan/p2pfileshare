version: '1'
services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_SERVLET_MAX_HTTP_HEADER_SIZE=32000
      - SERVER_TOMCAT_MAX_HTTP_POST_SIZE=10000000

    # Expose the dynamic port range for P2P file sharing
    expose:
      - "49152-65535:49152-65535"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend